# Producción: Postgres con pgvector real (imagen oficial de pgvector). Para usar modelos reales,
# define en .env: LLM_PROVIDER=anthropic ANTHROPIC_API_KEY=... EMBED_PROVIDER=voyage VOYAGE_API_KEY=...
services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U rag"], interval: 5s, retries: 10 }
  app:
    build: .
    environment:
      DATABASE_URL: postgres://rag:rag@db:5432/rag
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-local}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      PRICE_INPUT_PER_MTOK: ${PRICE_INPUT_PER_MTOK:-0}
      PRICE_OUTPUT_PER_MTOK: ${PRICE_OUTPUT_PER_MTOK:-0}
    ports: ["4300:4300"]
    depends_on: { db: { condition: service_healthy } }
volumes:
  pgdata:
