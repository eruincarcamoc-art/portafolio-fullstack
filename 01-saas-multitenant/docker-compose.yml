services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tenantly
      POSTGRES_PASSWORD: tenantly
      POSTGRES_DB: tenantly
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantly"]
      interval: 5s
      retries: 10
    ports: ["5432:5432"]

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tenantly:tenantly@db:5432/tenantly
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      WEB_ORIGIN: http://localhost:8080
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}
    depends_on: { db: { condition: service_healthy } }

  web:
    build: { context: ., dockerfile: Dockerfile.web }
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata:
