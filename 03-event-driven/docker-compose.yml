# El mismo código en dos roles: `api` acepta pedidos; `worker` procesa (relay + consumidores).
# Escala los workers con:  docker compose up --scale worker=3
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: orderflow, POSTGRES_PASSWORD: orderflow, POSTGRES_DB: orderflow }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U orderflow"], interval: 5s, retries: 10 }

  api:
    build: .
    environment: &env
      ROLE: api
      PORT: 4200
      DATABASE_URL: postgres://orderflow:orderflow@db:5432/orderflow
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
    ports: ["4200:4200"]
    depends_on: { db: { condition: service_healthy } }

  worker:
    build: .
    environment:
      <<: *env
      ROLE: worker
      PORT: 4201
    depends_on: { db: { condition: service_healthy } }

volumes:
  pgdata:
