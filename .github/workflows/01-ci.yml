name: CI · 01-saas-multitenant
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['01-saas-multitenant/**', '.github/workflows/01-ci.yml']
  pull_request:
    paths: ['01-saas-multitenant/**', '.github/workflows/01-ci.yml']

defaults:
  run:
    working-directory: 01-saas-multitenant

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: 01-saas-multitenant/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.api -t tenantly-api .
      - run: docker build -f Dockerfile.web -t tenantly-web .
